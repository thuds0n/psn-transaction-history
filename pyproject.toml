[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psn-transactions"
version = "0.1.0"
description = "Export your complete PlayStation Network transaction history"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.42",
    "typer>=0.9",
    "requests",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
psn-transactions = "psn_transactions.cli:app"

[tool.setuptools.packages.find]
include = ["psn_transactions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
